<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-jp/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-jp/600.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#05070f}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,#1d2558 0%,#0d1233 55%,#04060d 100%)}
#stars,#fx{position:absolute;inset:0}
#emb{position:absolute;left:90px;top:520px;width:900px;height:900px;opacity:.11}
.scene{position:absolute;left:90px;right:90px;top:0;height:1920px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;opacity:0}
.l{font-family:'Noto Serif JP',serif;color:#f3e6c0;font-size:62px;line-height:1.75;letter-spacing:.06em;font-weight:400;text-shadow:0 0 24px rgba(0,0,0,.6)}
.big{font-size:76px;font-weight:600;color:#fff6d8}
.gold{color:#e8c77a}
.sm{font-size:48px;color:#d9cfb0}
.sig{font-size:50px;color:#e8c77a;margin-top:70px}
.gap{height:40px}
#preload{position:absolute;opacity:0;font-family:'Noto Serif JP',serif}
</style></head><body>
<div id="bg"></div><canvas id="stars" width="1080" height="1920"></canvas>
<div id="emb"></div><svg id="fx" width="1080" height="1920"></svg>
<div id="scenes"></div><div id="preload"></div>
<script>
const W=1080,H=1920;
let S=[],stars=[];
function rnd(i){const x=Math.sin(i*999.7)*43758.5453;return x-Math.floor(x)}
for(let i=0;i<220;i++)stars.push([rnd(i)*W,rnd(i+500)*H,rnd(i+900)*1.8+.4,rnd(i+1300)*6.28]);
function setup(cfg){
  document.getElementById('emb').innerHTML=cfg.emblem;
  const sc=document.getElementById('scenes');let all='';
  S=cfg.scenes;
  S.forEach((s,i)=>{const d=document.createElement('div');d.className='scene';d.id='s'+i;
    d.innerHTML=s.html;if(s.top)d.style.justifyContent='flex-start',d.style.paddingTop=s.top+'px';sc.appendChild(d);all+=d.innerText;});
  document.getElementById('preload').innerHTML=['400','600'].map(w=>`<span style="font-weight:${w}">${all}— 紗希一二三</span>`).join('');
  return document.fonts.ready.then(()=>new Promise(r=>setTimeout(r,500)));
}
function ease(x){return x<0?0:x>1?1:x*x*(3-2*x)}
function moon(cx,cy,r,phase,op){ // phase 1 full .. 0 thin
  const off=r*2*phase;
  return `<defs><clipPath id="mc"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs>
  <g opacity="${op}"><circle cx="${cx}" cy="${cy}" r="${r+18}" fill="#e8c77a" opacity=".08"/>
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="#121a46"/>
  <g clip-path="url(#mc)"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#f3e6c0"/>
  <circle cx="${cx-off}" cy="${cy}" r="${r}" fill="#121a46"/></g>
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#c9a24a" stroke-width="2" opacity=".7"/></g>`;
}
function icons(op,t){
  const y=1180,xs=[230,540,850];let g='';
  // moon
  g+=`<g opacity="${op[0]}"><circle cx="${xs[0]}" cy="${y}" r="70" fill="#e8c77a"/><circle cx="${xs[0]+28}" cy="${y-16}" r="62" fill="#111842"/></g>`;
  // compass
  const a=Math.sin(t*1.5)*12;
  g+=`<g opacity="${op[1]}"><circle cx="${xs[1]}" cy="${y}" r="72" fill="none" stroke="#e8c77a" stroke-width="4"/><circle cx="${xs[1]}" cy="${y}" r="58" fill="none" stroke="#e8c77a" stroke-width="1.5" opacity=".6"/>
  <g transform="rotate(${a} ${xs[1]} ${y})"><path d="M${xs[1]} ${y-60} L${xs[1]+12} ${y} L${xs[1]} ${y+60} L${xs[1]-12} ${y} Z" fill="#fff6d8"/><path d="M${xs[1]} ${y} L${xs[1]+12} ${y} L${xs[1]} ${y+60} L${xs[1]-12} ${y} Z" fill="#c9a24a"/></g></g>`;
  // map
  g+=`<g opacity="${op[2]}"><path d="M${xs[2]-75} ${y-55} l50 -15 l50 15 l50 -15 v110 l-50 15 l-50 -15 l-50 15 Z" fill="none" stroke="#e8c77a" stroke-width="4"/>
  <path d="M${xs[2]-25} ${y-70} v110 M${xs[2]+25} ${y-55} v110" stroke="#e8c77a" stroke-width="2" opacity=".7"/>
  <path d="M${xs[2]-55} ${y+20} q30 -40 60 -10 t50 -30" fill="none" stroke="#fff6d8" stroke-width="2.5" stroke-dasharray="6 6"/><circle cx="${xs[2]+55}" cy="${y-22}" r="6" fill="#fff6d8"/></g>`;
  const lb=['一　月','二　羅針盤','三　古い地図'];xs.forEach((x,j)=>{g+=`<text x="${x}" y="${y+150}" text-anchor="middle" font-family="Noto Serif JP" font-size="44" fill="#f3e6c0" opacity="${op[j]}">${lb[j]}</text>`});
  return g;
}
function render(t){
  const c=document.getElementById('stars').getContext('2d');c.clearRect(0,0,W,H);
  for(const [x,y,r,p] of stars){c.globalAlpha=.25+.55*(.5+.5*Math.sin(t*1.3+p));c.fillStyle='#fff';c.beginPath();c.arc(x,y,r,0,6.283);c.fill();}
  document.getElementById('emb').style.transform=`rotate(${t*3}deg)`;
  let fx='';
  S.forEach((s,i)=>{
    const el=document.getElementById('s'+i);
    const fi=ease((t-s.a)/0.7), fo=1-ease((t-(s.b-0.5))/0.5);
    const o=Math.max(0,Math.min(fi,fo));
    el.style.opacity=o;el.style.transform=`translateY(${(1-fi)*24}px)`;
    if(s.fx==='symbols'){const k=[0,1,2].map(j=>Math.min(o,ease((t-s.a-0.4-j*0.5)/0.6)));fx+=icons(k,t);}
    if(s.fx==='moonwane'){const ph=1-0.85*ease((t-s.a)/(s.b-s.a-0.5));fx+=moon(540,1350,120,ph,o);}
    if(s.fx==='moonwax'){const ph=0.15+0.85*ease((t-s.a-0.3)/(s.b-s.a-0.8));fx+=moon(540,1350,120,ph,o);}
    if(s.fx==='moonfull'){fx+=moon(540,1350,120,1,o);}
    if(s.fx==='circles'){const cs=[[540,1130],[475,1240],[605,1240]],col=['#d8c8ff','#e8c77a','#b9d4ff'];
      cs.forEach((p,j)=>{const k=Math.min(o,ease((t-s.a-0.3-j*0.4)/0.6));fx+=`<circle cx="${p[0]}" cy="${p[1]}" r="120" fill="none" stroke="${col[j]}" stroke-width="3" opacity="${k}"/>`});
      const k=Math.min(o,ease((t-s.a-1.8)/0.6));fx+=`<circle cx="540" cy="1203" r="${10+6*Math.sin(t*3)}" fill="#fff6d8" opacity="${k}"/><circle cx="540" cy="1203" r="40" fill="#e8c77a" opacity="${k*.25}"/>`;}
  });
  document.getElementById('fx').innerHTML=fx;
}
</script></body></html>
