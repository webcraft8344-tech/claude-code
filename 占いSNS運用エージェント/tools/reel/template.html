<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-jp/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-jp/600.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#05070f}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,#1d2558 0%,#0d1233 55%,#04060d 100%)}
#stars,#fx{position:absolute;inset:0}
#emb{position:absolute;left:40px;top:560px;width:1000px;height:1000px;opacity:.26}
#neb,#fig{position:absolute;inset:0}
#por{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;display:none}
#por img{position:absolute;left:26px;top:880px;width:1500px;height:1500px;transform-origin:514px 420px;
 -webkit-mask-image:linear-gradient(to bottom,transparent 0,black 220px),linear-gradient(to right,transparent 0,black 120px);-webkit-mask-composite:source-in;filter:brightness(.92) saturate(1.05)}
#shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(4,6,16,.85) 0,rgba(4,6,16,.55) 700px,rgba(4,6,16,0) 1120px,rgba(4,6,16,0) 1560px,rgba(4,6,16,.55) 1920px);display:none}
.scene{position:absolute;left:80px;right:80px;top:0;height:1920px;padding-top:300px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;text-align:center;opacity:0}
.l{font-family:'Noto Serif JP',serif;color:#f3e6c0;font-size:62px;line-height:1.75;letter-spacing:.06em;font-weight:400;text-shadow:0 0 18px rgba(0,0,0,.9),0 0 40px rgba(5,7,20,.8)}
.big{font-size:76px;font-weight:600;color:#fff6d8}
.gold{color:#e8c77a}
.sm{font-size:48px;color:#d9cfb0}
.sig{font-size:50px;color:#e8c77a;margin-top:70px}
.gap{height:40px}
#preload{position:absolute;opacity:0;font-family:'Noto Serif JP',serif}
</style></head><body>
<div id="bg"></div>
<svg id="neb" width="1080" height="1920"><defs>
<radialGradient id="n1"><stop offset="0" stop-color="#6b3fa0" stop-opacity=".55"/><stop offset="1" stop-color="#6b3fa0" stop-opacity="0"/></radialGradient>
<radialGradient id="n2"><stop offset="0" stop-color="#1f6f8b" stop-opacity=".45"/><stop offset="1" stop-color="#1f6f8b" stop-opacity="0"/></radialGradient>
<radialGradient id="n3"><stop offset="0" stop-color="#c9a24a" stop-opacity=".22"/><stop offset="1" stop-color="#c9a24a" stop-opacity="0"/></radialGradient>
<radialGradient id="n4"><stop offset="0" stop-color="#a0336b" stop-opacity=".30"/><stop offset="1" stop-color="#a0336b" stop-opacity="0"/></radialGradient>
</defs><g id="nebg"></g></svg>
<canvas id="stars" width="1080" height="1920"></canvas>
<div id="emb"></div>
<div id="por"><img id="porimg"></div><div id="shade"></div>
<svg id="fig" width="1080" height="1920"><defs>
<radialGradient id="orb"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#fff2c4"/><stop offset=".7" stop-color="#e8c77a" stop-opacity=".6"/><stop offset="1" stop-color="#e8c77a" stop-opacity="0"/></radialGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".55"/><stop offset=".5" stop-color="#c9a24a" stop-opacity=".18"/><stop offset="1" stop-color="#c9a24a" stop-opacity="0"/></radialGradient>
<linearGradient id="robe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1030"/><stop offset=".6" stop-color="#070a1f"/><stop offset="1" stop-color="#03040b"/></linearGradient>
<linearGradient id="rim" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e8c77a" stop-opacity=".0"/><stop offset=".45" stop-color="#e8c77a" stop-opacity=".9"/><stop offset="1" stop-color="#e8c77a" stop-opacity=".35"/></linearGradient>
</defs><g id="figg"></g></svg><svg id="fx" width="1080" height="1920"></svg>
<div id="scenes"></div><div id="preload"></div>
<script>
const W=1080,H=1920;
let S=[],stars=[],FXY=930,POR=false,DUR=10;
function rnd(i){const x=Math.sin(i*999.7)*43758.5453;return x-Math.floor(x)}
for(let i=0;i<220;i++)stars.push([rnd(i)*W,rnd(i+500)*H,rnd(i+900)*1.8+.4,rnd(i+1300)*6.28]);
function setup(cfg){
  DUR=cfg.duration;
  if(cfg.portrait){POR=true;FXY=cfg.fxY||820;document.getElementById('porimg').src=cfg.portrait;document.getElementById('por').style.display='block';document.getElementById('shade').style.display='block';document.getElementById('fig').style.display='none';}
  document.getElementById('emb').innerHTML=cfg.emblem;
  const sc=document.getElementById('scenes');let all='';
  S=cfg.scenes;
  S.forEach((s,i)=>{const d=document.createElement('div');d.className='scene';d.id='s'+i;
    d.innerHTML=s.html;if(s.top)d.style.justifyContent='flex-start',d.style.paddingTop=s.top+'px';sc.appendChild(d);all+=d.innerText;});
  document.getElementById('preload').innerHTML=['400','600'].map(w=>`<span style="font-weight:${w}">${all}— 紗希一二三</span>`).join('');
  const im=document.getElementById('porimg');const imgReady=POR?(im.complete?Promise.resolve():new Promise(r=>im.onload=r)):Promise.resolve();
  return imgReady.then(()=>document.fonts.ready).then(()=>new Promise(r=>setTimeout(r,500)));
}
function ease(x){return x<0?0:x>1?1:x*x*(3-2*x)}
function moon(cx,cy,r,phase,op){ // phase 1 full .. 0 thin
  const off=r*2*phase;
  return `<defs><clipPath id="mc"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs>
  <g opacity="${op}"><circle cx="${cx}" cy="${cy}" r="${r+18}" fill="#e8c77a" opacity=".08"/>
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="#121a46"/>
  <g clip-path="url(#mc)"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#f3e6c0"/>
  <circle cx="${cx-off}" cy="${cy}" r="${r}" fill="#121a46"/></g>
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#c9a24a" stroke-width="2" opacity=".7"/></g>`;
}
function icons(op,t){
  const y=FXY,xs=[230,540,850];let g='';
  // moon
  g+=`<g opacity="${op[0]}"><circle cx="${xs[0]}" cy="${y}" r="70" fill="#e8c77a"/><circle cx="${xs[0]+28}" cy="${y-16}" r="62" fill="#111842"/></g>`;
  // compass
  const a=Math.sin(t*1.5)*12;
  g+=`<g opacity="${op[1]}"><circle cx="${xs[1]}" cy="${y}" r="72" fill="none" stroke="#e8c77a" stroke-width="4"/><circle cx="${xs[1]}" cy="${y}" r="58" fill="none" stroke="#e8c77a" stroke-width="1.5" opacity=".6"/>
  <g transform="rotate(${a} ${xs[1]} ${y})"><path d="M${xs[1]} ${y-60} L${xs[1]+12} ${y} L${xs[1]} ${y+60} L${xs[1]-12} ${y} Z" fill="#fff6d8"/><path d="M${xs[1]} ${y} L${xs[1]+12} ${y} L${xs[1]} ${y+60} L${xs[1]-12} ${y} Z" fill="#c9a24a"/></g></g>`;
  // map
  g+=`<g opacity="${op[2]}"><path d="M${xs[2]-75} ${y-55} l50 -15 l50 15 l50 -15 v110 l-50 15 l-50 -15 l-50 15 Z" fill="none" stroke="#e8c77a" stroke-width="4"/>
  <path d="M${xs[2]-25} ${y-70} v110 M${xs[2]+25} ${y-55} v110" stroke="#e8c77a" stroke-width="2" opacity=".7"/>
  <path d="M${xs[2]-55} ${y+20} q30 -40 60 -10 t50 -30" fill="none" stroke="#fff6d8" stroke-width="2.5" stroke-dasharray="6 6"/><circle cx="${xs[2]+55}" cy="${y-22}" r="6" fill="#fff6d8"/></g>`;
  const lb=['一　月','二　羅針盤','三　古い地図'];xs.forEach((x,j)=>{g+=`<text x="${x}" y="${y+150}" text-anchor="middle" font-family="Noto Serif JP" font-size="44" fill="#f3e6c0" opacity="${op[j]}">${lb[j]}</text>`});
  return g;
}
const parts=[];for(let i=0;i<70;i++)parts.push([rnd(i+2000)*W,rnd(i+2100),rnd(i+2200)*2.2+1,rnd(i+2300)*30+18,rnd(i+2400)*6.28]);
function figure(t){
  const pulse=.5+.5*Math.sin(t*2.2);
  const cx=540;
  let g=`<circle cx="${cx}" cy="1450" r="${330+pulse*30}" fill="url(#halo)"/>`;
  // light rays
  for(let i=0;i<12;i++){const a=i*30+t*6;g+=`<g transform="rotate(${a} ${cx} 1450)"><path d="M${cx} 1450 L${cx-9} 1120 L${cx+9} 1120 Z" fill="#ffe9a8" opacity="${.05+.04*Math.sin(t*1.7+i)}"/></g>`;}
  // robe silhouette (hooded, seen from front, face in shadow)
  const robe=`M${cx} 1150 C ${cx-70} 1155 ${cx-112} 1215 ${cx-118} 1300 C ${cx-125} 1345 ${cx-165} 1370 ${cx-215} 1400 C ${cx-280} 1440 ${cx-300} 1560 ${cx-330} 1700 C ${cx-350} 1800 ${cx-370} 1880 ${cx-380} 1920 L ${cx+380} 1920 C ${cx+370} 1880 ${cx+350} 1800 ${cx+330} 1700 C ${cx+300} 1560 ${cx+280} 1440 ${cx+215} 1400 C ${cx+165} 1370 ${cx+125} 1345 ${cx+118} 1300 C ${cx+112} 1215 ${cx+70} 1155 ${cx} 1150 Z`;
  g+=`<path d="${robe}" fill="url(#robe)" stroke="url(#rim)" stroke-width="3"/>`;
  // hood opening (shadow) + faint face glow
  g+=`<path d="M${cx} 1200 C ${cx-58} 1205 ${cx-80} 1260 ${cx-78} 1320 C ${cx-60} 1345 ${cx+60} 1345 ${cx+78} 1320 C ${cx+80} 1260 ${cx+58} 1205 ${cx} 1200 Z" fill="#010208"/>`;
  g+=`<ellipse cx="${cx}" cy="1318" rx="48" ry="18" fill="#e8c77a" opacity="${.10+.06*pulse}"/>`;
  // gold embroidery: stars on robe
  [[cx-150,1560],[cx+170,1620],[cx-210,1760],[cx+235,1800],[cx-60,1700],[cx+80,1850]].forEach(([x,y],i)=>{g+=`<circle cx="${x}" cy="${y}" r="3" fill="#e8c77a" opacity="${.5+.4*Math.sin(t*2+i)}"/>`});
  g+=`<path d="M${cx-150} 1560 L${cx-60} 1700 L${cx+80} 1850 M${cx+170} 1620 L${cx+235} 1800" stroke="#c9a24a" stroke-width="1.2" opacity=".35" fill="none"/>`;
  // sleeves / hands holding orb
  g+=`<path d="M${cx-215} 1400 C ${cx-170} 1470 ${cx-110} 1500 ${cx-55} 1490 L ${cx-50} 1520 C ${cx-130} 1540 ${cx-200} 1510 ${cx-240} 1460 Z" fill="#0d1338" stroke="url(#rim)" stroke-width="2"/>`;
  g+=`<path d="M${cx+215} 1400 C ${cx+170} 1470 ${cx+110} 1500 ${cx+55} 1490 L ${cx+50} 1520 C ${cx+130} 1540 ${cx+200} 1510 ${cx+240} 1460 Z" fill="#0d1338" stroke="url(#rim)" stroke-width="2"/>`;
  // orb
  g+=`<circle cx="${cx}" cy="1450" r="${120+pulse*10}" fill="url(#orb)" opacity=".55"/><circle cx="${cx}" cy="1450" r="48" fill="url(#orb)"/>`;
  g+=`<ellipse cx="${cx}" cy="1450" rx="70" ry="22" fill="none" stroke="#fff2c4" stroke-width="1.5" opacity=".6" transform="rotate(${t*40} ${cx} 1450)"/>`;
  return g;
}
function render(t){
  const c=document.getElementById('stars').getContext('2d');c.clearRect(0,0,W,H);
  for(const [x,y,r,p] of stars){c.globalAlpha=.25+.55*(.5+.5*Math.sin(t*1.3+p));c.fillStyle='#fff';c.beginPath();c.arc(x,y,r,0,6.283);c.fill();}
  for(const [x,y0,r,sp,p] of parts){const y=(1920-((y0*1920+t*sp)%2000));c.globalAlpha=.25+.5*(.5+.5*Math.sin(t*2+p));c.fillStyle='#ffe9a8';c.beginPath();c.arc(x+Math.sin(t*.7+p)*14,y,r,0,6.283);c.fill();}
  const ss=(t%7)/7;if(ss<.12){const k=ss/.12,x0=900-k*700,y0=180+k*320;const gr=c.createLinearGradient(x0,y0,x0+160,y0-70);gr.addColorStop(0,'rgba(255,240,200,.9)');gr.addColorStop(1,'rgba(255,240,200,0)');c.globalAlpha=1-k;c.strokeStyle=gr;c.lineWidth=3;c.beginPath();c.moveTo(x0,y0);c.lineTo(x0+160,y0-70);c.stroke();}
  c.globalAlpha=1;
  document.getElementById('nebg').innerHTML=`<ellipse cx="${300+Math.sin(t*.2)*40}" cy="500" rx="520" ry="380" fill="url(#n1)"/><ellipse cx="${820+Math.cos(t*.17)*40}" cy="900" rx="480" ry="420" fill="url(#n2)"/><ellipse cx="540" cy="1450" rx="620" ry="520" fill="url(#n3)"/><ellipse cx="${760+Math.sin(t*.13)*30}" cy="300" rx="380" ry="260" fill="url(#n4)"/>`;
  if(POR){const z=t<0.9?1.22-0.14*ease(t/0.9):1.08+0.06*ease((t-0.9)/(DUR-0.9));document.getElementById('porimg').style.transform=`scale(${z})`;}
  else document.getElementById('figg').innerHTML=figure(t);
  document.getElementById('emb').style.transform=`rotate(${t*3}deg)`;
  let fx='';
  S.forEach((s,i)=>{
    const el=document.getElementById('s'+i);
    const fi=s.instant?1:ease((t-s.a)/0.7), fo=1-ease((t-(s.b-0.5))/0.5);
    const o=Math.max(0,Math.min(fi,fo));
    el.style.opacity=o;el.style.transform=`translateY(${(1-fi)*24}px)`;
    if(s.fx==='symbols'){const k=[0,1,2].map(j=>Math.min(o,ease((t-s.a-0.4-j*0.5)/0.6)));fx+=icons(k,t);}
    if(s.fx==='moonwane'){const ph=1-0.85*ease((t-s.a)/(s.b-s.a-0.5));fx+=moon(540,FXY+30,105,ph,o);}
    if(s.fx==='moonwax'){const ph=0.15+0.85*ease((t-s.a-0.3)/(s.b-s.a-0.8));fx+=moon(540,FXY+30,105,ph,o);}
    if(s.fx==='moonfull'){fx+=moon(540,FXY+30,105,1,o);}
    if(s.fx==='circles'){const cs=[[540,FXY-70],[475,FXY+40],[605,FXY+40]],col=['#d8c8ff','#e8c77a','#b9d4ff'];
      cs.forEach((p,j)=>{const k=Math.min(o,ease((t-s.a-0.3-j*0.4)/0.6));fx+=`<circle cx="${p[0]}" cy="${p[1]}" r="120" fill="none" stroke="${col[j]}" stroke-width="3" opacity="${k}"/>`});
      const k=Math.min(o,ease((t-s.a-1.8)/0.6));fx+=`<circle cx="540" cy="${FXY+3}" r="${10+6*Math.sin(t*3)}" fill="#fff6d8" opacity="${k}"/><circle cx="540" cy="${FXY+3}" r="40" fill="#e8c77a" opacity="${k*.25}"/>`;}
  });
  document.getElementById('fx').innerHTML=fx;
}
</script></body></html>
